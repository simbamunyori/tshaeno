name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tshaeno
          POSTGRES_PASSWORD: tshaeno
          POSTGRES_DB: tshaeno
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tshaeno"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      # The tests connect as the app role, so row-level security is really in force.
      DATABASE_URL: postgresql://tshaeno_app:tshaeno_app@localhost:5432/tshaeno
      MIGRATE_DATABASE_URL: postgresql://tshaeno:tshaeno@localhost:5432/tshaeno
      REDIS_URL: redis://localhost:6379
      TOTP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Create the app role
        run: PGPASSWORD=tshaeno psql -h localhost -U tshaeno -d tshaeno -c "CREATE ROLE tshaeno_app LOGIN PASSWORD 'tshaeno_app'"
      - name: Check migrations match the schema
        run: |
          PGPASSWORD=tshaeno psql -h localhost -U tshaeno -d tshaeno -c "CREATE DATABASE tshaeno_shadow"
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url postgresql://tshaeno:tshaeno@localhost:5432/tshaeno_shadow --exit-code
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: Docker stack, backup and restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway .env
        run: |
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^APP_DB_PASSWORD=.*|APP_DB_PASSWORD=$(openssl rand -hex 16)|" .env
          sed -i "s|^TOTP_ENCRYPTION_KEY=.*|TOTP_ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^APP_URL=.*|APP_URL=https://localhost|" .env
      - name: Build the image
        run: docker compose build app
      - name: Start the stack, the same way scripts/deploy.sh does
        run: |
          docker compose up -d --wait db redis
          docker compose run --rm migrate
          docker compose up -d --no-deps --wait app worker
          docker compose up -d caddy
      - name: The app answers through Caddy
        run: curl -fsSk --retry 10 --retry-delay 2 --retry-all-errors https://localhost/api/health
      - name: The app connects as a role row-level security applies to
        run: |
          test "$(docker compose exec -T db psql -tA -U tshaeno -d tshaeno -c "SELECT rolsuper OR rolbypassrls FROM pg_roles WHERE rolname = 'tshaeno_app'")" = "f"
      - name: The worker is running
        run: |
          sleep 5
          docker compose logs worker | grep -q "Worker started."
      - name: Back up, then restore into a fresh database
        run: |
          ./scripts/backup.sh
          ./scripts/restore-test.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color

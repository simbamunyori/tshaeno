# Production stack: web app, worker, PostgreSQL, Redis and Caddy (automatic HTTPS).
# Usage: cp .env.example .env, fill it in, then `docker compose up -d`.
# TSHAENO_IMAGE picks the image to run; scripts/deploy.sh sets it to an
# exact version, so rolling back means starting the previous one.
x-app: &app
  image: ${TSHAENO_IMAGE:-tshaeno:local}
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_URL: postgresql://tshaeno_app:${APP_DB_PASSWORD}@db:5432/tshaeno
    MIGRATE_DATABASE_URL: postgresql://tshaeno:${POSTGRES_PASSWORD}@db:5432/tshaeno
    REDIS_URL: redis://redis:6379
    NODE_ENV: production

services:
  migrate:
    <<: *app
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["worker"]
    healthcheck:
      # The worker touches this file every 10 seconds while Redis answers.
      test: ["CMD", "node", "-e", "const s=require('fs').statSync('/tmp/worker-heartbeat');process.exit(Date.now()-s.mtimeMs<60000?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tshaeno
      POSTGRES_DB: tshaeno
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tshaeno -d tshaeno"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  db-data:
  redis-data:
  caddy-data:
  caddy-config:
